services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_opportunity
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev
    ports:
      - "5432:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_opportunity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - campus_redis_data:/data

volumes:
  campus_postgres_data:
  campus_redis_data:

